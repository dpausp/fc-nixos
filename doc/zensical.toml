# Explicit navigation -- the Zensical equivalent of the hand-curated MyST
# toctree groups that drove the Sphinx/furo sidebar (uncaptioned root group,
# "Infrastructure (IaaS & Resources)", "Platform (Operations & Concepts)",
# generated platform-version group). Group
# titles use the sections' real page headings.
#
# NOTE: the nav key lives INSIDE the [project] table -- zensical's config
# parser keeps ONLY the [project] table when it is present and silently
# drops every top-level key (probed 2026-08-17).
#
# Pages present in docs_dir but NOT listed here are still built, just not
# linked in the sidebar (probed: zensical emits no warning for unlisted
# pages): index.md (the manual index -- reached via the logo/site-title
# links instead of a redundant nav entry), devopsguide-de.md (linked from
# dead media, do not rename), and the German tree de/**
# (translated pages for links in official German documents -- directories
# mirror URLs: src/de/<path>.md serves at /de/<path>/; each page
# cross-links its English twin; tests/test_de_pages.py pins ref
# resolution, search exclusion, and nav exclusion).
# All of them -- and every sunsetting snapshot page under src/<NN.NN>/
# (placed and adapted by tools.checkout_versioned_docs) -- carry
# `search: exclude: true` frontmatter so they stay out of the search
# index (probed: search.json drops them).
#
# The nav is fully hand-maintained: the former generated nav blocks
# (changes-releases from tools.generate_release_notes, platform-versions
# from tools.fetch_platform_docs) died with those fetch-era tools.
# Versioned docs are reachable via the client-side version switcher
# (see _static/version-switcher*.js), not via nav groups.
[project]
site_name    = "Flying Circus Platform"
site_url     = "https://docs.flyingcircus.io"
copyright    = "Flying Circus Internet Operations GmbH"
docs_dir     = "src"
site_dir     = "_build"
use_directory_urls = false
extra_css    = [
    "_static/flyingcircus.css",
    "_static/version-switcher.css",
    "_static/vendor/glightbox.min.css",
]
# Load order matters: the data file provides window.PLATFORM_VERSIONS,
# the URL module (window.VersionSwitcherUrls) must exist before
# version-switcher.js consumes it. The vendored
# glightbox runtime + shim come first: the runtime defines
# window.GLightbox (so the theme bundle never lazy-loads it from
# unpkg.com), the shim rewrites the bundle's unconditional unpkg
# stylesheet link to the local vendor copy (same self-hosting policy as
# the vendored fonts).
extra_javascript = [
    "_static/vendor/glightbox.min.js",
    "_static/glightbox-local.js",
    "_static/platform-versions.js",
    "_static/version-switcher-urls.js",
    "_static/version-switcher.js",
    "_static/version-switcher-fallback.js",
]

nav = [
  # "General" is the silent section: its title is hidden on desktop via
  # the nav-item.html hunk + flyingcircus.css (pinned by
  # tests/test_nav_general.py). Changelog links the current release
  # directly; the archive (changes/index.md) is generated -- cutting a
  # release: update the Changelog target and run
  # `./appenv python -m tools.gen_changes_index`.
  { "General" = [
      { "Changelog" = "changes/2026/r033.md" },
      { "Security" = [
          "security/data-protection.md",
          "security/disaster-recovery.md",
          "security/network.md",
          "security/policy.md",
          "security/software-vulnerabilities.md"
      ] },
      { "Support" = [
          "support/chat.md",
          "support/overview.md",
          "support/shared-screen-sessions.md"
      ] }
  ] },
  { "Infrastructure" = [
      { "Getting started" = "infrastructure/getting-started.md" },
      { "VMs" = "infrastructure/vms.md" },
      { "AI & ML" = "infrastructure/ai-ml.md" },
      { "Networking" = [
          "infrastructure/networking/connecting.md",
          "infrastructure/networking/redundant-router.md",
          "infrastructure/networking/firewall.md",
          "infrastructure/networking/networking.md",
          "infrastructure/networking/outbound.md"
      ] },
      { "Block Storage" = "infrastructure/block-storage.md" },
      { "Object Storage" = "infrastructure/object-storage.md" },
      { "Backup" = "infrastructure/backup.md" },
      { "Hardware" = [
          "infrastructure/hardware/data-centers.md",
          "infrastructure/hardware/specs.md"
      ] }
  ] },
  { "Platform" = [
      "platform/upgrades-whats-new.md",
      { "Philosophy" = "platform/philosophy.md" },
      { "Users" = [
          { "Generating SSH keys" = "platform/users/ssh-keygen.md" },
          { "User Package Management" = "platform/user-profile.md" }
      ] },
      { "Operations & Security" = [
          { "Base Environment" = "platform/base.md" },
          { "Cron" = "platform/cron.md" },
          { "Firewall" = "platform/firewall.md" },
          { "Garbage Collection" = "platform/garbage-collection.md" },
          { "Local Configuration" = "platform/local.md" },
          { "Logging" = "platform/logging.md" },
          { "Monitoring" = "platform/monitoring.md" },
          { "Logrotate" = "platform/logrotate.md" },
          { "Maintenance" = "platform/maintenance.md" },
          { "Systemd" = "platform/systemd.md" }
      ] },
      { "Deployments" = [
          "platform/deployment/lamp.md",
          "platform/deployment/mongodb.md"
      ] },
      { "API" = [
          "platform/api/introduction.md",
          "platform/api/examples.md",
          "platform/api/methods.md",
          "platform/api/types.md",
          "platform/api/log.md"
      ] }
  ] },
  { "Components" = [
      { "Databases" = [
          { "FerretDB" = "components/ferretdb.md" },
          { "MariaDB" = "components/mariadb.md" },
          { "MongoDB" = "components/mongodb.md" },
          { "MySQL" = "components/mysql.md" },
          { "PostgreSQL" = "components/postgresql.md" } ] },
      { "Web Serving" = [
          { "LAMP (Apache/php-fpm)" = "components/lamp.md" },
          { "Webgateway (NGINX, HAProxy)" = "components/webgateway.md" },
          { "Vinyl Cache / Varnish (Webproxy)" = "components/webproxy.md" } ] },
      { "Containers & Orchestration" = [
          { "Docker" = "components/docker.md" },
          { "Kubernetes Cluster (k3s)" = "components/kubernetes.md" } ] },
      { "Caching & Messaging" = [
          { "Memcached" = "components/memcached.md" },
          { "RabbitMQ" = "components/rabbitmq.md" },
          { "Redis" = "components/redis.md" } ] },
      { "Mail" = [
          { "Mail server" = "components/mailserver.md" },
          { "Mail stub" = "components/mailstub.md" } ] },
      { "AI & Machine Learning" = [
          { "Open WebUI" = "components/open-webui.md" },
          { "Slurm Workload Manager" = "components/slurm.md" } ] },
      { "Developer Tools" = [
          { "Development Host" = "components/devhost.md" },
          { "Gitlab" = "components/gitlab.md" } ] },
      { "Search & Analytics" = [
          { "Matomo" = "components/matomo.md" },
          { "OpenSearch" = "components/opensearch.md" } ] },
      { "Monitoring" = [
          { "Statshost (Grafana, Prometheus, Loki)" = "components/statshost.md" } ] },
      { "Storage & Networking" = [
          { "External network gateway" = "components/external_net.md" },
          { "NFS" = "components/nfs.md" } ] }
  ] }
]

[project.theme]
language = "en"
variant  = "classic"
logo     = "_static/RZ_FC-Logo_RGB_100-1080.svg"
# Local template overrides (theme/partials/...): the logo anchors link the
# manual index even though index.md is not in the nav (upstream would link
# the FIRST nav page there).
custom_dir = "theme"
features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.top",
    "navigation.sections",
    "navigation.tracking",
    "search.highlight",
]

# Self-hosted fonts: font = false suppresses the Google Fonts <link> and the
# theme's --md-text-font/--md-code-font <style> (base.html); the @font-face
# declarations and :root variables in _static/flyingcircus.css restore the
# same typefaces from the vendored woff2 files in _static/fonts/.
# NOTE: this key must stay BEFORE the [[project.theme.palette]] arrays --
# bare keys after an array-of-tables header belong to the last array element.
font = false

[[project.theme.palette]]
scheme      = "default"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme      = "slate"
primary     = "custom"
accent      = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums     = true
line_spans          = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
# Shared markdown fragments (--8<-- "file.md") live under snippets/, outside
# docs_dir (src/) so they never render as standalone pages.
# check_paths is NOT the default: without it, missing snippets are silently
# dropped -- we want the build to fail loudly instead (doctrine: no fallback).
# base_path resolves relative to doc/ (cwd of make/serve, see README).
# Warm-cache caveat (verified on 0.0.57 and 0.0.60): 0.0.60's render-cache
# bypass regex anchors at line 1 -- our markers sit below the H1, so warm
# builds serve cached pages and snippet edits/removals only surface on cold
# builds (CI) or when the including page itself changes.
[project.markdown_extensions.pymdownx.snippets]
base_path = "snippets"
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tilde]
# Strip MyST % comment lines before parsing — they are not Python-Markdown
# syntax and would render as visible text in the HTML output.
[project.markdown_extensions.md_comments]

# Image zoom via lightbox overlay (bundled zensical extension, no new
# dependency): content images (screenshots, diagrams) become click-to-zoom.
# The decorative {.logo} section thumbnails are excluded via skip_classes
# (off-glb is a built-in skip); alt text doubles as the lightbox caption.
# flyingcircus.css caps the inline previews at 24em, so the lightbox (which
# never upscales) always opens larger AND sharp (user decision 2026-08-20).
# The runtime itself is vendored under _static/vendor/ (see extra_css and
# extra_javascript) -- the theme bundle's unpkg.com lazy-load stays dormant.
[project.markdown_extensions.zensical.extensions.glightbox]
auto_caption = true
skip_classes = ["logo"]
