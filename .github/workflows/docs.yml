name: docs

# The GitHub mirror build of the platform documentation: run the doc
# test suite, build the manual via make in doc/, and upload the HTML
# as an artifact. No deploy job -- publishing happens elsewhere.
#
# The checkout carries FULL history: the doc tools resolve the
# platform-versions.toml revs as mirror branches
# (refs/remotes/origin/<branch>), and a shallow clone only fetches
# the built branch. In git mode the matched ref is GITHUB_REF_NAME
# (the branch being built); --matched would win over it.

on:
  push:
    paths:
      - "doc/**"
  workflow_dispatch:

jobs:
  build:
    name: Build platform documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the monorepo with all mirror branches
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Pinned to an exact immutable release: setup-uv publishes no
      # major/minor moving tags since v8.0.0 (supply-chain policy),
      # so '@v10' would not resolve at all -- only the full version
      # tag is a valid, silent-change-proof pin. The cache is keyed
      # on uv.lock (the action's default dependency glob).
      - name: Install pinned uv with lockfile cache
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Run the doc test suite
        working-directory: doc
        run: make test

      - name: Build the documentation (switcher, snapshots, HTML)
        working-directory: doc
        run: make

      - name: Upload the HTML build
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: doc/_build
